# Postgres de développement (jamais en production : voir infra/).
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: presidente
    ports: ['127.0.0.1:5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
