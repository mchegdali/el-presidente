# Collecte de VictoriaMetrics, toutes les 30 s, sur le réseau Docker presidente-monitoring
# (sans accès à Internet). %{METRICS_TOKEN} est remplacé au démarrage par la variable
# d'environnement du conteneur : aucun secret dans l'image.
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['presidente-api:9464']
    authorization:
      credentials: '%{METRICS_TOKEN}'
  - job_name: litestream
    static_configs:
      - targets: ['presidente-litestream:9090']
  - job_name: node
    static_configs:
      - targets: ['presidente-node-exporter:9100']
  - job_name: vmalert
    static_configs:
      - targets: ['presidente-vmalert:8880']
  - job_name: victoriametrics
    static_configs:
      - targets: ['localhost:8428']
