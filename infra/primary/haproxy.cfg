# HAProxy devant l'API (CX23 n°1). TLS terminé ici, HTTP/2 côté clients, WebSocket en
# tunnel, transmission à Bun par socket Unix (pas de TCP local).
#
# Réglages notables :
#   - nbthread 1 épinglé sur le cœur 0 : l'autre cœur reste à Bun (à revoir selon le banc) ;
#   - TLS 1.3 uniquement, certificat ECDSA, tickets de session (reprise sans poignée complète) ;
#   - pas d'OCSP stapling : Let's Encrypt a arrêté OCSP en août 2025 ;
#   - pas de compression (réponses minuscules, CPU partagé) ;
#   - `timeout server` < délai d'inactivité de Bun : ce n'est jamais l'amont qui ferme une
#     connexion que HAProxy croit réutilisable.

global
    log stdout format raw local0 info
    nbthread 1
    cpu-map auto:1/1 0
    # Plafond de connexions (2 descripteurs chacune) : le compose relève `nofile` en conséquence.
    maxconn "${HAPROXY_MAXCONN}"
    stats socket /run/haproxy/admin.sock mode 600 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.3
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    tune.ssl.default-dh-param 2048
    tune.bufsize 16384

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 60s
    # Connexions WebSocket : une heure d'inactivité au plus (Bun envoie des pings).
    timeout tunnel 1h
    timeout client-fin 5s

frontend public
    bind :80
    bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1 curves X25519:P-256
    backlog 4096
    http-request redirect scheme https code 301 unless { ssl_fc }
    # Défi ACME (acme.sh en mode « stateless » : réponse calculée, pas de fichier).
    http-request return status 200 content-type text/plain lf-string "%[path,field(-1,/)].${ACME_THUMBPRINT}\n" if { path_beg '/.well-known/acme-challenge/' }

    # Adresse réelle du client pour l'API (journal du chat, limitation de débit).
    http-request set-header X-Real-IP %[src]
    http-request del-header X-Forwarded-For
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains"

    # /metrics n'est jamais exposé publiquement (scrapé en local sur la socket).
    http-request deny status 404 if { path /metrics }

    default_backend api

backend api
    option httpchk
    # HTTP/1.1 avec Host : sans Host, Bun ne reconstruit pas l'URL de la requête.
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host api.local
    http-check expect status 200
    # Une seule instance autoritaire (l'état des parties est en mémoire).
    server bun /run/presidente/api.sock check inter 5s fall 3 rise 2 maxconn 10000
