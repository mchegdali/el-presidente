# Postgres 17 sur CX23 (2 vCPU partagés, 4 Go) partagé avec l'API et HAProxy.
# Charge : écritures groupées et courtes (une ligne par table active), lectures froides.

# listen_addresses : adresse privée Hetzner, passée par compose.yml (-c listen_addresses=…).
unix_socket_directories = '/var/run/postgresql'
unix_socket_permissions = 0770         # accès par le groupe 999, partagé avec l'API
max_connections = 20                   # l'API en utilise 2

# Mémoire
shared_buffers = 1GB
huge_pages = try                       # vm.nr_hugepages dimensionné dans sysctl.d
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 128MB

# Requêtes courtes : la compilation JIT coûte plus qu'elle ne rapporte.
jit = off
random_page_cost = 1.1
effective_io_concurrency = 200

# Journal (WAL) et points de contrôle
wal_level = replica
wal_compression = zstd
wal_buffers = 16MB
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
# Durabilité par défaut ; seules les écritures de coups la relâchent (SET LOCAL
# synchronous_commit = off, voir apps/api/src/features/tables/shared/game-writer.ts).
synchronous_commit = on
fsync = on
full_page_writes = on

# Réplication asynchrone vers le standby (CX23 n°2) : aucune latence ajoutée.
max_wal_senders = 3
max_replication_slots = 3
wal_keep_size = 512MB

# Chiffrement de la réplication (réseau privé, mais défense en profondeur)
ssl = on
ssl_cert_file = '/etc/postgresql/certs/server.crt'
ssl_key_file = '/etc/postgresql/certs/server.key'
ssl_min_protocol_version = 'TLSv1.3'

# Observation
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
track_io_timing = on
log_min_duration_statement = 200ms
log_checkpoints = on
log_autovacuum_min_duration = 1s
log_line_prefix = '%m [%p] %q%u@%d '

autovacuum_naptime = 30s
