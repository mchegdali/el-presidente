# /etc/sysctl.d/99-presidente.conf — réseau et mémoire pour un serveur de jeu temps réel.

# Contrôle de congestion BBR avec ordonnanceur fq : meilleur débit et latence sur Internet.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# Petites écritures WebSocket envoyées sans attendre de remplir le tampon.
net.ipv4.tcp_notsent_lowat = 16384
# Pas de retour au démarrage lent sur une socket WebSocket restée inactive.
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_fastopen = 3
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.ip_local_port_range = 10240 65535
fs.file-max = 1048576
# HAProxy (utilisateur non root) écoute sur 80 et 443.
net.ipv4.ip_unprivileged_port_start = 80

# Mémoire : Postgres préfère la RAM, pages énormes réservées pour shared_buffers (1 Go).
vm.swappiness = 10
vm.nr_hugepages = 530
# Pas de vm.overcommit_memory = 2 : JavaScriptCore (Bun) réserve de grandes plages
# virtuelles qu'il n'utilise pas ; un comptage strict ferait échouer l'API au démarrage.
