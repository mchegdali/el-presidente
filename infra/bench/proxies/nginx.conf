# Banc : 2 workers, TLS 1.3, HTTP/1.1 + HTTP/2, pas de journal d'accès, API par socket Unix.
# Banc seulement : workers root pour ouvrir la socket de l'API (0660, uid 65532), comme
# HAProxy et Caddy qui tournent en root dans ce banc.
user root;
worker_processes 2;
worker_rlimit_nofile 65536;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 32768;
}

http {
    access_log off;
    server_tokens off;

    upstream api {
        server unix:/run/presidente/api.sock;
        keepalive 64;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 443 ssl reuseport backlog=4096;
        http2 on;
        ssl_certificate     /certs/bench.crt;
        ssl_certificate_key /certs/bench.key;
        ssl_protocols TLSv1.3;
        # Alignés sur les autres proxys : X25519 puis P-256, même ordre de suites TLS 1.3.
        ssl_ecdh_curve X25519:prime256v1;
        ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
        # Ordre du serveur (comme HAProxy) : sinon OpenSSL suit le client (AES-256 en tête).
        ssl_prefer_server_ciphers on;

        location = /metrics { return 404; }

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 1h;
            proxy_send_timeout 30s;
            # Réponses relayées au fil de l'eau, comme HAProxy, Caddy et Pingora.
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
