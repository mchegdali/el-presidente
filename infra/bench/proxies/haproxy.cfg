# Banc : configuration de production (infra/primary/haproxy.cfg) sans ACME ni journaux,
# réglages alignés sur les autres proxys (voir PROXIES.md, « Réglages communs ») :
#   - 2 threads, une socket d'écoute par thread (comme nginx reuseport) ;
#   - TLS 1.3, X25519 puis P-256 (pas d'échange post-quantique), même ordre de suites ;
#   - keep-alive vers l'API (pas de `http-server-close`) ;
#   - pas d'attente pour regrouper les petits envois (`http-no-delay`).
global
    nbthread 2
    # 2 descripteurs par connexion relayée ; nofile du conteneur = 65536.
    maxconn 30000
    ssl-default-bind-options ssl-min-ver TLSv1.3
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-curves X25519:P-256
    tune.bufsize 16384

defaults
    mode http
    option http-keep-alive
    option http-no-delay
    http-reuse always
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    timeout http-keep-alive 60s
    timeout tunnel 1h
    timeout client-fin 5s

frontend public
    bind :443 ssl crt /certs/bench.pem alpn h2,http/1.1 shards by-thread
    backlog 4096
    http-request set-header X-Real-IP %[src]
    http-request del-header X-Forwarded-For
    http-request deny status 404 if { path /metrics }
    default_backend api

backend api
    server bun /run/presidente/api.sock maxconn 20000
