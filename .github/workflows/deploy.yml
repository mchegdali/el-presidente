name: Déploiement

# À chaque push sur main : images → GHCR (par empreinte), puis `pulumi up` de la pile prod.
# Aucun secret GitHub : Pulumi Cloud par OIDC (environnement GitHub `production`, limité à
# main), secrets dans l'environnement ESC el-presidente/prod.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.api.outputs.digest }}
      caddy: ${{ steps.caddy.outputs.digest }}
      litestream: ${{ steps.litestream.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/images/api.Dockerfile
          push: true
          tags: ghcr.io/mchegdali/el-presidente-api:${{ github.sha }}
      - id: caddy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/images
          file: infra/images/caddy.Dockerfile
          push: true
          tags: ghcr.io/mchegdali/el-presidente-caddy:${{ github.sha }}
      - id: litestream
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/images
          file: infra/images/litestream.Dockerfile
          push: true
          tags: ghcr.io/mchegdali/el-presidente-litestream:${{ github.sha }}

  deploy:
    needs: images
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Jeton Pulumi Cloud de courte durée, échangé contre le jeton OIDC de GitHub. Jeton
      # personnel : les jetons d'organisation par OIDC sont réservés à l'offre Enterprise.
      - uses: pulumi/auth-actions@159c3e431aab767d4519b96f3f784d7d3d725622 # v2.1.1
        with:
          organization: mchegdali
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:chegdalim
      # Clé SSH de la CI (ESC) dans un agent : jamais écrite sur le disque.
      - id: esc
        uses: pulumi/esc-action@eec71a90d9989af7ff14bd700b83fc72fae36119 # v4.0.0
        with:
          environment: mchegdali/el-presidente/prod
          export-environment-variables: false
      - name: Agent SSH
        env:
          CI_SSH_KEY: ${{ steps.esc.outputs.CI_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "$CI_SSH_KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: mchegdali/el-presidente/prod
          work-dir: infra
          config-map: |
            el-presidente:images:
              value: '{"api":"ghcr.io/mchegdali/el-presidente-api@${{ needs.images.outputs.api }}","caddy":"ghcr.io/mchegdali/el-presidente-caddy@${{ needs.images.outputs.caddy }}","litestream":"ghcr.io/mchegdali/el-presidente-litestream@${{ needs.images.outputs.litestream }}"}'
              secret: false
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
