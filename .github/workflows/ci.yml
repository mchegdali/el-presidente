name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jeton du workflow en lecture seule : la CI ne publie rien.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      # Les tests de l'API et de la base tournent sur un vrai Postgres (bases jetables).
      TEST_DATABASE_URL: postgres://app@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - name: Build API binary
        run: bun run --filter '@el-presidente/api' build

  e2e:
    runs-on: ubuntu-24.04
    needs: check
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_DB: presidente
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      DATABASE_URL: postgres://app@localhost:5432/presidente
      E2E_DATABASE_URL: postgres://app@localhost:5432/presidente
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/db migrate
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4100
      - run: bun run e2e
        working-directory: apps/web
