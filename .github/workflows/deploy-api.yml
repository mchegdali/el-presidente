name: Déploiement de l'API

# Déploiement manuel (ou à chaque push sur main une fois la production en place) :
# image → GHCR, puis sur le serveur : migrations, redémarrage de l'API.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Déployer sur le serveur (décocher pour publier l'image seulement)
        type: boolean
        default: true

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/images/api.Dockerfile
          push: true
          tags: |
            ghcr.io/mchegdali/el-presidente-api:${{ steps.meta.outputs.tag }}
            ghcr.io/mchegdali/el-presidente-api:latest

  deploy:
    needs: image
    if: inputs.deploy
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Migrations puis redémarrage de l'API
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh deploy@"$SSH_HOST" "cd /srv/presidente/app/infra/primary && API_TAG=$TAG ./deploy.sh"
